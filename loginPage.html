<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCU SKILLCONNECT</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
p{
  color: white;
  background: #2C2C2C;
  padding: 12px 15px;
  margin-bottom: 10px;
}
body{
  font-family: Times New Roman, sans-serif;
  font-size: 16px;
  color: white;
  line-height: 1.6;
  padding: 10px 30px;
  background: white;
}
button{
  color: white;
  background: #1A4D8F;
}
footer{
  color: white;
  background: #000080;
  padding: 8px 15px;
}
h1 {
  font-size: 40px;
  color: #0a5dc2;
  text-align: center;
}

img{
  border-radius: 48px 48px 48px 48px;
}
.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 20px;
}
.brand-logo {
  width: 48px;
  height: 48px;
  object-fit: contain;
  border-radius: 0;
}
.brand-title {
  margin: 0;
  font-size: clamp(1.1rem, 5vw, 1.6rem);
  color: #ffffff; /* Made header title white to match */
  white-space: nowrap;
}
</style>
</head>
<body>
    <a href="#" class="d-flex align-items-center gap-3 text-decoration-none">
                    <div class="badge-gradient p-1 rounded-3 shadow-sm d-flex align-items-center justify-content-center" style="width: 48px; height: 48px; border: 1px solid rgba(212, 175, 55, 0.4);">
                        <div class="bg-ucu-blue w-100 h-100 rounded-3 d-flex align-items-center justify-content-center text-ucu-gold">
                            <img src="UCU skillconnect3.jpg" alt="skill logo">
                            <i class="fa-solid fa-graduation-cap fs-5"></i>
                        </div>
                    </div>
                    <div>
                        <div class="d-flex align-items-center gap-1">
                            <span class="fw-extrabold fs-4 tracking-tight text-ucu-blue">UCU</span>
                            <span class="fw-bold fs-4 text-ucu-purple">SkillConnect</span>
                        </div>
                        <span class="text-uppercase text-muted fw-semibold block" style="font-size: 10px; letter-spacing: 0.5px; margin-top: -4px;">Uganda Christian University</span>
                    </div>
                </a>
<div class="container">
  <div class="row justify-content-center align-items-center vh-100">
    <div class="col-md-4">
      <div class="card shadow">
        <div class="card-body p-0">
          <!-- Added text-white class here so all text inside becomes white automatically -->
          <div class="login-container p-4 text-white" style="background-color: #000080;">

            <div class="brand">
              <img src="UCU skillconnect3.jpg" alt="logo" class="brand-logo">
              <h1 class="brand-title">UCU SKILLCONNECT</h1>
            </div>

            <div class="form-field mb-2">
              <input class="radio" name="radios" type="radio" id="radioLabel" />
              <label for="radioLabel"><em>Trainee</em></label>
            </div>
            <div class="form-field mb-3">
              <input class="radio" name="radios" type="radio" id="radioLabel2" />
              <label for="radioLabel2"><em>Trainer</em></label>
            </div>

            <form class="needs-validation" novalidate>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control border-dark" placeholder="Enter email" required>
                <div class="invalid-feedback">
                  Please enter a valid email address.
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control border-dark" placeholder="Enter password" id="password" required pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$">
                <div class="invalid-feedback text-warning">
                  Password must have:
                  <ul>
                    <li>8+ characters</li>
                    <li>1 uppercase letter</li>
                    <li>1 lowercase letter</li>
                    <li>1 number</li>
                  </ul>
                </div>
              </div>

              <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input border-dark" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Remember Me</label>
              </div>

              <button type="submit" class="btn btn-primary w-100">
                Login
              </button>
            </form>

            <script>
            (() => {
                'use strict';
                const forms = document.querySelectorAll('.needs-validation');
                Array.from(forms).forEach(form => {
                    form.addEventListener('submit', event => {
                        if (!form.checkValidity()) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                        form.classList.add('was-validated');
                    }, false);
                });
            })();
            </script>

            <div class="text-center mt-3">
                <a href="chil.html" class="text-white text-decoration-underline">Forgot Password?</a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<footer>
<br>
&copy; 2026 <strong><em>UCU SKILLCONNECT. All rights reserved.</em></strong><br>Contact: support@ucuskillconnect.ac.ug
</footer>
</body>
</html>
